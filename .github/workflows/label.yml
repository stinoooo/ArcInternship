# Automatically labels pull requests based on changed files.
# Rules are defined in .github/labeler.yml using actions/labeler@v5 format.
# New labels defined in labeler.yml are created in the repository automatically
# when sync-labels is enabled.

name: Labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Apply labels based on changed files
        uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          # Automatically create any labels defined in labeler.yml that don't
          # exist yet in the repository.
          sync-labels: true
